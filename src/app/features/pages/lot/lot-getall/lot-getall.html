<div class="space-y-5 p-3 sm:p-4 lg:p-6 max-w-[1700px] mx-auto">

    <header
        class="relative overflow-hidden rounded-3xl bg-slate-900 text-white p-6 sm:p-8 shadow-xl border border-slate-800">

        <div
            class="absolute -top-20 -right-20 w-80 h-80 bg-gradient-to-br from-pink-500/20 via-rose-500/15 to-transparent rounded-full blur-3xl pointer-events-none">
        </div>
        <div
            class="absolute -bottom-20 -left-20 w-80 h-80 bg-gradient-to-tr from-purple-600/15 via-pink-600/10 to-transparent rounded-full blur-3xl pointer-events-none">
        </div>
        <div
            class="absolute inset-0 bg-[radial-gradient(rgba(255,255,255,0.06)_1px,transparent_1px)] [background-size:16px_16px] pointer-events-none">
        </div>

        <div class="relative z-10 flex flex-col lg:flex-row lg:items-center justify-between gap-6">

            <div class="space-y-2 max-w-xl">
                <div
                    class="inline-flex items-center gap-2 bg-pink-500/10 border border-pink-500/20 px-3 py-1 rounded-full text-xs font-semibold text-pink-300">
                    <span class="relative flex h-2 w-2">
                        <span
                            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-pink-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-pink-500"></span>
                    </span>
                    <i class="pi pi-shield text-[11px]"></i>
                    <span class="tracking-wide">Botica Virgen de Cocharcas</span>
                </div>

                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">
                    Control de Lotes y Vencimientos
                </h1>

                <p class="text-xs sm:text-sm text-slate-300/80 font-normal leading-relaxed">
                    Trazabilidad de fabricación, seguimiento FEFO/FIFO, auditoría de caducidad y valorización de
                    almacén.
                </p>
            </div>

            <div class="flex flex-wrap sm:flex-nowrap items-center gap-3">

                <div
                    class="flex-1 sm:flex-none flex items-center gap-3 bg-slate-800/60 backdrop-blur-md border border-slate-700/60 p-3.5 rounded-2xl min-w-[170px]">
                    <div
                        class="w-10 h-10 rounded-xl bg-rose-500/10 border border-rose-500/20 flex items-center justify-center text-rose-400 shrink-0">
                        <i class="pi pi-calendar-times text-lg"></i>
                    </div>
                    <div>
                        <span class="block text-[11px] text-slate-400 font-medium">Por Vencer</span>
                        <span class="text-sm font-bold text-rose-300">
                            {{ porVencer() }}
                            <span class="text-xs font-normal text-rose-300">
                                {{ porVencer() === 1 ? 'lote' : 'lotes' }}
                            </span>
                        </span>
                    </div>
                </div>

                <div
                    class="flex-1 sm:flex-none flex items-center gap-3 bg-slate-800/60 backdrop-blur-md border border-slate-700/60 p-3.5 rounded-2xl min-w-[170px]">
                    <div
                        class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 shrink-0">
                        <i class="pi pi-box text-lg"></i>
                    </div>
                    <div>
                        <span class="block text-[11px] text-slate-400 font-medium">Valor Almacén</span>
                        <span class="text-sm font-bold text-emerald-400">
                            S/ {{ valorAlmacen() | number:'1.2-2' }}
                        </span>
                    </div>
                </div>

            </div>

        </div>
    </header>

    <section>
        <app-lot-kpi [totalLotes]="totalLotes()" [optimos]="optimos()" [porVencer]="porVencer()" [vencidos]="vencidos()"
            [agotados]="agotados()" [valorAlmacen]="valorAlmacen()">
        </app-lot-kpi>
    </section>

    <section class="flex flex-col gap-5">

        <app-lot-sidebar class="w-full shrink-0" [proveedores]="proveedores()" [estados]="estados()"
            [proveedorSeleccionado]="proveedorSeleccionado()" [estadoSeleccionado]="estadoSeleccionado()"
            (proveedorChange)="onProveedorChange($event)" (estadoChange)="onEstadoChange($event)"
            (searchChange)="onBusqueda($event)" />

        <app-lot-table class="w-full min-w-0" [lotes]="filtrados()" [loading]="loading()" [error]="error()" />

    </section>

    <section class="flex flex-col lg:flex-row gap-4 items-stretch">
        <div class="flex-1 min-w-0">
            <app-lot-stock [lotes]="lotes()" />
        </div>
        <div class="flex-1 min-w-0">
            <app-lot-status [lotes]="lotes()" [porVencer]="porVencer()" />
        </div>
    </section>

</div>
