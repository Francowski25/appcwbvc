<div
    class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-2.5 sm:gap-3 lg:gap-4 w-full items-stretch">

    <div
        class="card bg-white rounded-2xl border border-pink-100 shadow-sm p-3 sm:p-4 col-span-1 flex flex-col justify-between h-full hover:shadow-md transition-shadow min-w-0">
        <div class="flex items-start justify-between gap-1.5 min-w-0">
            <span
                class="text-[10px] sm:text-[11px] font-bold text-slate-400 uppercase tracking-wider leading-tight min-h-[22px] flex items-center truncate">Total</span>
            <div class="w-7 h-7 sm:w-9 sm:h-9 rounded-xl bg-pink-50 flex items-center justify-center shrink-0">
                <i class="pi pi-th-large text-pink-500 text-xs sm:text-base"></i>
            </div>
        </div>
        <div class="mt-2 min-w-0">
            <span class="text-lg sm:text-2xl font-black text-gray-800 leading-none block truncate">{{ totalLotes()
                }}</span>
            <span class="text-[10px] sm:text-[11px] font-bold text-pink-400 mt-1.5 flex items-center gap-1 truncate">
                <i class="pi pi-box text-[10px] sm:text-xs shrink-0"></i>
                <span class="truncate">Registrados</span>
            </span>
        </div>
    </div>

    <div
        class="card bg-white rounded-2xl border border-pink-100 shadow-sm p-3 sm:p-4 col-span-1 flex flex-col justify-between h-full hover:shadow-md transition-shadow min-w-0">
        <div class="flex items-start justify-between gap-1.5 min-w-0">
            <span
                class="text-[10px] sm:text-[11px] font-bold text-slate-400 uppercase tracking-wider leading-tight min-h-[22px] flex items-center truncate">Óptimos</span>
            <div class="w-7 h-7 sm:w-9 sm:h-9 rounded-xl bg-pink-50 flex items-center justify-center shrink-0">
                <i class="pi pi-check-circle text-pink-500 text-xs sm:text-base"></i>
            </div>
        </div>
        <div class="mt-2 min-w-0">
            <span class="text-lg sm:text-2xl font-black text-gray-800 leading-none block truncate">{{ optimos()
                }}</span>
            <span class="text-[10px] sm:text-[11px] font-bold text-pink-400 mt-1.5 flex items-center gap-1 truncate">
                <span class="w-1.5 h-1.5 rounded-full bg-pink-400 animate-pulse shrink-0"></span>
                <span class="truncate">Vigentes</span>
            </span>
        </div>
    </div>

    <div
        class="card bg-white rounded-2xl border border-pink-100 shadow-sm p-3 sm:p-4 col-span-1 flex flex-col justify-between h-full hover:shadow-md transition-shadow min-w-0">
        <div class="flex items-start justify-between gap-1.5 min-w-0">
            <span
                class="text-[10px] sm:text-[11px] font-bold text-slate-400 uppercase tracking-wider leading-tight min-h-[22px] flex items-center truncate">Por
                Vencer</span>
            <div class="w-7 h-7 sm:w-9 sm:h-9 rounded-xl bg-pink-50 flex items-center justify-center shrink-0">
                <i class="pi pi-clock text-pink-500 text-xs sm:text-base"></i>
            </div>
        </div>
        <div class="mt-2 min-w-0">
            <span class="text-lg sm:text-2xl font-black text-gray-800 leading-none block truncate">{{ porVencer()
                }}</span>
            <span class="text-[10px] sm:text-[11px] font-bold text-pink-400 mt-1.5 flex items-center gap-1 truncate">
                <i class="pi pi-exclamation-triangle text-[10px] sm:text-xs shrink-0"></i>
                <span class="truncate">Próx. 30 días</span>
            </span>
        </div>
    </div>

    <div
        class="card bg-white rounded-2xl border border-pink-100 shadow-sm p-3 sm:p-4 col-span-1 flex flex-col justify-between h-full hover:shadow-md transition-shadow min-w-0">
        <div class="flex items-start justify-between gap-1.5 min-w-0">
            <span
                class="text-[10px] sm:text-[11px] font-bold text-slate-400 uppercase tracking-wider leading-tight min-h-[22px] flex items-center truncate">Vencidos</span>
            <div class="w-7 h-7 sm:w-9 sm:h-9 rounded-xl bg-pink-50 flex items-center justify-center shrink-0">
                <i class="pi pi-calendar-times text-pink-500 text-xs sm:text-base"></i>
            </div>
        </div>
        <div class="mt-2 min-w-0">
            <span class="text-lg sm:text-2xl font-black text-gray-800 leading-none block truncate">{{ vencidos()
                }}</span>
            <span class="text-[10px] sm:text-[11px] font-bold text-pink-400 mt-1.5 flex items-center gap-1 truncate">
                <i class="pi pi-times-circle text-[10px] sm:text-xs shrink-0"></i>
                <span class="truncate">Sin vigencia</span>
            </span>
        </div>
    </div>

    <div
        class="card bg-white rounded-2xl border border-pink-100 shadow-sm p-3 sm:p-4 col-span-1 flex flex-col justify-between h-full hover:shadow-md transition-shadow min-w-0">
        <div class="flex items-start justify-between gap-1.5 min-w-0">
            <span
                class="text-[10px] sm:text-[11px] font-bold text-slate-400 uppercase tracking-wider leading-tight min-h-[22px] flex items-center truncate">Agotados</span>
            <div class="w-7 h-7 sm:w-9 sm:h-9 rounded-xl bg-pink-50 flex items-center justify-center shrink-0">
                <i class="pi pi-ban text-pink-500 text-xs sm:text-base"></i>
            </div>
        </div>
        <div class="mt-2 min-w-0">
            <span class="text-lg sm:text-2xl font-black text-gray-800 leading-none block truncate">{{ agotados()
                }}</span>
            <span class="text-[10px] sm:text-[11px] font-bold text-pink-400 mt-1.5 flex items-center gap-1 truncate">
                <i class="pi pi-exclamation-circle text-[10px] sm:text-xs shrink-0"></i>
                <span class="truncate">Stock cero</span>
            </span>
        </div>
    </div>

    <div
        class="card bg-white rounded-2xl border border-pink-100 shadow-sm p-3 sm:p-4 col-span-1 flex flex-col justify-between h-full hover:shadow-md transition-shadow min-w-0">
        <div class="flex items-start justify-between gap-1.5 min-w-0">
            <span
                class="text-[10px] sm:text-[11px] font-bold text-slate-400 uppercase tracking-wider leading-tight min-h-[22px] flex items-center truncate">Valor</span>
            <div class="w-7 h-7 sm:w-9 sm:h-9 rounded-xl bg-pink-50 flex items-center justify-center shrink-0">
                <i class="pi pi-dollar text-pink-500 text-xs sm:text-base"></i>
            </div>
        </div>
        <div class="mt-2 min-w-0">
            <span class="text-base sm:text-xl font-black text-gray-800 leading-none block truncate"
                [title]="valorAlmacen() | number:'1.2-2'">
                S/ {{ valorAlmacen() | number:'1.2-2' }}
            </span>
            <span class="text-[10px] sm:text-[11px] font-bold text-pink-400 mt-1.5 flex items-center gap-1 truncate">
                <i class="pi pi-wallet text-[10px] sm:text-xs shrink-0"></i>
                <span class="truncate">Inversión</span>
            </span>
        </div>
    </div>

</div>
